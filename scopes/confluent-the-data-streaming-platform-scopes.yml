docs_note: 'Confluent publishes no OAuth SCOPES reference page, because scopes are not how this API authorizes.
  Only the partner OAuth scheme declares any (partner:describe / create / alter / delete, plus marketplace::describe),
  and those cover a partner-entitlement surface most callers never touch. Every other request is authorized
  by RBAC ROLE BINDINGS attached to the calling user, service account or identity pool — the predefined
  role list at the docs URL above is the real permission reference for this provider, and it is what an
  integrator should read where they would normally read a scope table. Searched 2026-09-05 and confirmed:
  there is no scope catalogue to add.'
