  transport: HTTP Basic — API key ID as username, secret as password.
  oauth: OAuth 2.0 client credentials against https://api.confluent.cloud/sts/v1/oauth2/token (Confluent
    STS), or a token from an external IdP registered as an identity provider.
  workload_identity: iam/v2 identity-providers and identity-pools support OIDC federation, so a workload
    can exchange an external IdP token rather than holding a long-lived key.
  key_management: Keys are created and rotated with createIamV2ApiKey / deleteIamV2ApiKey or the confluent
    CLI. The secret is returned once at creation and cannot be retrieved again.
  mcp: 'The managed MCP servers reuse the same credentials, base64-encoded into an Authorization: Basic
    header. Global API keys work on both managed servers; Cloud API keys on the global server only; Flink
    API keys on the regional server only.'
  scopes: Only the partner OAuth scheme declares scopes (partner:describe / create / alter / delete).
    Everything else is authorized by RBAC role bindings, not by token scope.
