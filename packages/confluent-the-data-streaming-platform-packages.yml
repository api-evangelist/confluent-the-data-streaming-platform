method: searched
source: >-
  npm registry.npmjs.org, pypi.org, api.nuget.org, proxy.golang.org,
  packages.confluent.io/maven (Confluent publishes its Java artifacts to its own
  Maven repository, not Maven Central), and the Confluent docs client pages
  https://docs.confluent.io/platform/current/clients/index.html
notes: >-
  Confluent's client surface is unusually broad because it ships both Apache Kafka
  clients (librdkafka and its language bindings) and Confluent Cloud control-plane
  SDKs. Java artifacts (io.confluent:*) are NOT on Maven Central; they are served from
  packages.confluent.io/maven, so the version below is read from that repository's
  maven-metadata.xml rather than search.maven.org.
