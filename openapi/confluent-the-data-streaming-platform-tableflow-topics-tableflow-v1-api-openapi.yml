        Retrieve a sorted, filtered, paginated list of all tableflow topics.'
      parameters:
      - name: spec.table_formats
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MultipleSearchFilter'
        example:
        - DELTA
        - ICEBERG
        description: Filter the results by exact match for spec.table_formats. Pass multiple times to see results matching any of the values.
        style: form
        explode: true
      - name: environment
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SearchFilter'
        example: env-00000
        description: Filter the results by exact match for environment.
      - name: spec.kafka_cluster
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SearchFilter'
        example: lkc-00000
        description: Filter the results by exact match for spec.kafka_cluster.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
          x-max-page-items: 500
        description: A pagination size for collection requests.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: An opaque pagination token for collection requests.
      tags:
      - Tableflow Topics (tableflow/v1)
      security:
      - resource-api-key: []
      responses:
        '200':
          description: Tableflow Topic.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/tableflow.v1.TableflowTopicList'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        properties:
                          spec:
                            type: object
