components:
  schemas:
    tableflow.v1.ByobAwsSpec:
      type: object
      description: The Tableflow storage config for BYOB enabled topic in AWS
      required:
      - kind
      - bucket_name
      - provider_integration_id
      properties:
        kind:
          type: string
          enum:
          - ByobAws
          description: 'The storage type

            '
          x-immutable: true
        bucket_name:
          description: Bucket name
          type: string
          example: bucket_1
          x-immutable: true
        bucket_region:
          description: Bucket region
          type: string
          example: us-east-1
          x-immutable: true
          readOnly: true
        provider_integration_id:
          type: string
          description: The provider integration id
          example: cspi-stgce89r7
          x-immutable: true
        table_path:
          type: string
          description: The current storage path where the data and metadata is stored for this table
          example: s3://dummy-bucket-name-1/10011010/11101100/org-1/env-2/lkc-3/v1/tableId
          readOnly: true
    GlobalObjectReference:
      type: object
      description: ObjectReference provides information for you to locate the referred object
      required:
      - id
      - related
      - resource_name
      properties:
        id:
          type: string
          description: ID of the referred resource
          minLength: 1
          maxLength: 255
        related:
          type: string
          format: uri
          description: API URL for accessing or modifying the referred object
          minLength: 1
          readOnly: true
        resource_name:
          type: string
          format: uri
          description: CRN reference to the referred resource
          minLength: 1
          readOnly: true
    tableflow.v1.TableflowTopicList:
      type: object
      description: 'A Tableflow Topic represents configuration related to a Tableflow enabled kafka topic



        ## The Tableflow Topics Model

        <SchemaDefinition schemaRef="#/components/schemas/tableflow.v1.TableflowTopic" />'
      required:
      - api_version
      - kind
      - metadata
      - data
      properties:
        api_version:
          type: string
          enum:
          - tableflow/v1
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - TableflowTopicList
        metadata:
          allOf:
          - $ref: '#/components/schemas/ListMeta'
          - properties:
              first:
                example: https://api.confluent.cloud/tableflow/v1/tableflow-topics
              last:
                example: https://api.confluent.cloud/tableflow/v1/tableflow-topics?page_token=bcAOehAY8F16YD84Z1wT
              prev:
                example: https://api.confluent.cloud/tableflow/v1/tableflow-topics?page_token=YIXRY97wWYmwzrax4dld
              next:
                example: https://api.confluent.cloud/tableflow/v1/tableflow-topics?page_token=UvmDWOB1iwfAIBPj6EYb
        data:
          type: array
          description: A data property that contains an array of resource items. Each entry in the array is a separate resource.
          items:
            allOf:
            - $ref: '#/components/schemas/tableflow.v1.TableflowTopic'
            - type: object
              required:
              - metadata
              - spec
              - status
              properties:
                spec:
                  type: object
                  required:
                  - display_name
                  - storage
                  - environment
                  - kafka_cluster
          uniqueItems: true
    ObjectMeta:
      description: ObjectMeta is metadata that all persisted resources must have, which includes all objects users must create.
      required:
      - self
      properties:
        self:
          description: Self is a Uniform Resource Locator (URL) at which an object can be addressed. This URL encodes the service location, API version, and other particulars necessary to locate the resource at a point in time
          type: string
          format: uri
          readOnly: true
          example: https://api.confluent.cloud/v2/kafka-clusters/lkc-f3a90de
        resource_name:
          description: Resource Name is a Uniform Resource Identifier (URI) that is globally unique across space and time. It is represented as a Confluent Resource Name
          type: string
          format: uri
          readOnly: true
          example: crn://confluent.cloud/kafka=lkc-f3a90de
        created_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was created. It is represented in RFC3339 format and is in UTC.
        updated_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was last updated. It is represented in RFC3339 format and is in UTC.
        deleted_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was (or will be) deleted. It is represented in RFC3339 format and is in UTC.
      readOnly: true
    tableflow.v1.ErrorHandlingSuspend:
      type: object
      description: 'Configuration for the `SUSPEND` error handling mode.

        '
      properties:
        mode:
          type: string
          enum:
          - SUSPEND
          description: 'The error handling mode for the Tableflow enabled topic.


            In this mode, the materialization of the topic is suspended in case of record failures.

            '
      required:
      - mode
    tableflow.v1.ErrorHandlingLog:
      type: object
      description: 'Configuration for the `LOG` error handling mode.

        '
      properties:
        mode:
          type: string
          enum:
          - LOG
          description: 'The error handling mode for the Tableflow enabled topic.


            In this mode, the bad records are logged to a dead-letter queue (DLQ) topic and the


            materialization continues with the next record.

            '
        target:
          type: string
          description: 'The topic to which the bad records will be logged in case of `LOG` error handling mode.


            Creates the topic if it doesn''t already exist; otherwise, the operation is idempotent and no action is taken.


            Default topic is `error_log`.

            '
          default: error_log
      required:
      - mode
    tableflow.v1.TableflowTopicSpec:
      type: object
      description: The desired state of the Tableflow Topic
      properties:
        display_name:
          type: string
          description: The name of the Kafka topic for which Tableflow is enabled.
          example: topic_1
          x-immutable: true
        suspended:
          type: boolean
          description: Indicates whether the Tableflow should be suspended. The API allows setting it only to `false` i.e., to resume the Tableflow. Pausing the Tableflow on-demand is not currently supported.
          example: false
        config:
          type: object
          description: The config for the Tableflow enabled topic
          allOf:
          - $ref: '#/components/schemas/tableflow.v1.TableFlowTopicConfigsSpec'
        storage:
          type: object
          description: The storage config
          oneOf:
          - $ref: '#/components/schemas/tableflow.v1.ByobAwsSpec'
          - $ref: '#/components/schemas/tableflow.v1.ManagedStorageSpec'
          - $ref: '#/components/schemas/tableflow.v1.AzureAdlsSpec'
          discriminator:
            propertyName: kind
            mapping:
              ByobAws: '#/components/schemas/tableflow.v1.ByobAwsSpec'
              Managed: '#/components/schemas/tableflow.v1.ManagedStorageSpec'
              AzureDataLakeStorageGen2: '#/components/schemas/tableflow.v1.AzureAdlsSpec'
          x-immutable: true
        table_formats:
          type: array
          description: 'The supported table formats for the Tableflow-enabled topic.

            '
          items:
            type: string
            x-extensible-enum:
            - DELTA
            - ICEBERG
          minItems: 1
          uniqueItems: true
          example:
          - DELTA
          default:
          - ICEBERG
        environment:
          allOf:
          - $ref: '#/components/schemas/GlobalObjectReference'
          description: The environment to which the target Kafka cluster belongs.
        kafka_cluster:
          allOf:
          - $ref: '#/components/schemas/EnvScopedObjectReference'
          description: The kafka cluster of the topic for which Tableflow is enabled
      x-enable-id: false
      x-enable-listmeta: true
      x-enable-objectmeta: true
    tableflow.v1.TableflowTopic:
      type: object
      description: 'A Tableflow Topic represents configuration related to a Tableflow enabled kafka topic



        ## The Tableflow Topics Model

        <SchemaDefinition schemaRef="#/components/schemas/tableflow.v1.TableflowTopic" />'
      properties:
        api_version:
          type: string
          enum:
          - tableflow/v1
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - TableflowTopic
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
