      x-self-access: false
      x-request-access-name: SQL API v1
      operationId: createSqlv1Tool
      summary: Create a Tool
      description: '![Preview](#section/Versioning/API-Lifecycle-Policy)


        Make a request to create a Tool.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
        description: The unique identifier for the organization.
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: database_name
        required: true
        schema:
          type: string
        description: The name of the database.
      tags:
      - Tools (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/sql.v1.Tool'
              - type: object
                required:
                - name
                - spec
      responses:
        '200':
          description: A Tool has been successfully created.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            Location:
              schema:
                type: string
                format: uri
                example: https://flink.region.provider.confluent.cloud/sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{database_name}/tools/{name}
              description: Tool resource uri
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/sql.v1.Tool'
                - type: object
                  required:
                  - name
                  - spec
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
    get:
      x-lifecycle-stage: Preview
      x-self-access: true
      x-request-access-name: SQL API v1
      operationId: listSqlv1Tools
      summary: List of Tools
      description: '![Preview](#section/Versioning/API-Lifecycle-Policy)


        Retrieve a sorted, filtered, paginated list of all Tools.'
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization.
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: database_name
        required: true
        schema:
          type: string
        description: The name of the database.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
          maximum: 100
          x-max-page-items: 500
        description: A pagination size for collection requests.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: An opaque pagination token for collection requests.
      tags:
      - Tools (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      responses:
        '200':
          description: Tools.
          content:
