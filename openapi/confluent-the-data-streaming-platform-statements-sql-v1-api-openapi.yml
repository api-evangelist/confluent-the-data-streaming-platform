          items:
            $ref: '#/components/schemas/sql.v1.StatementWarning'
          readOnly: true
        traits:
          $ref: '#/components/schemas/sql.v1.StatementTraits'
        network_kind:
          type: string
          x-extensible-enum:
          - PUBLIC
          - PRIVATE
          description: 'The networking type used by the submitted SQL statement:


            PUBLIC: SQL statement is using public networking;


            PRIVATE: SQL statement is using private networking;

            '
          example: PUBLIC
          readOnly: true
        latest_offsets:
          type: object
          additionalProperties:
            type: string
          description: 'The last Kafka offsets that a statement has processed. Represented by a mapping from Kafka topic to a

            string representation of partitions mapped to offsets.

            '
          example:
            topic-1: partition:0,offset:100;partition:1,offset:200
            topic-2: partition:0,offset:50
          readOnly: true
        latest_offsets_timestamp:
          type: string
          format: date-time
          example: '2025-11-10T16:20:00Z'
          description: The date and time at which the Kafka topic offsets were added to the statement status. It is represented in RFC3339 format and is in UTC.
          readOnly: true
        end_time:
          type: string
          format: date-time
          example: '2025-03-19T01:02:03-04:05'
          description: "The date and time in UTC (represented as RFC3339 format) at which the statement reached its final terminal state. \nThis field is set when the Phase is COMPLETED, FAILED, or STOPPED.\n\nNote - The attribute is in a [Early Access lifecycle](https://docs.confluent.io/cloud/current/api.html#section/Versioning/API-Lifecycle-Policy)\n"
        duration:
          type: string
          format: duration
          example: PT2H30M
          description: "The total elapsed time (represented as ISO 8601 format) from when the statement transitioned from \nPENDING to RUNNING until it reached a final terminal state. This field is calculated and set when \nthe Phase is COMPLETED, FAILED, or STOPPED.\n\nNote - The attribute is in a [Early Access lifecycle](https://docs.confluent.io/cloud/current/api.html#section/Versioning/API-Lifecycle-Policy)\n"
        affected_resource:
          type: object
          description: 'A reference to the resource created by this statement, if any. This field is set when a statement

            (e.g., CREATE MATERIALIZED TABLE) results in a new user-facing resource.


            Note - The attribute is in a [Early Access lifecycle](https://docs.confluent.io/cloud/current/api.html#section/Versioning/API-Lifecycle-Policy)

            '
          required:
          - kind
          - environment_id
          - resource_name
          properties:
            kind:
              type: string
              x-extensible-enum:
              - MATERIALIZED_TABLE
              description: The kind of resource that was created.
              example: MATERIALIZED_TABLE
            environment_id:
              type: string
              description: The unique identifier for the environment containing the resource.
              example: env-abc
            database_id:
              type: string
              description: 'The unique identifier for the database containing the resource.

                Only present for resource kinds that are scoped to a database.

                '
              example: lkc-123
            resource_name:
              type: string
              description: The name of the created resource, unique within its scope.
              example: my-materialized-table
        identity:
          type: string
          format: uri
          example: crn://confluent.cloud/organization=12345/identity-provider=op-12345/identity=alice@example.com
          description: "Optional, read-only. The CRN of the authenticated principal that\ncurrently owns this statement, sourced from the upstream\nauthentication decision. Initially populated when the statement\nis created and refreshed when `spec.principal` is updated, so it\nreflects the most recent setter rather than the original creator.\n\nTreat as a stable, opaque, non-parsable string for storage and\nmapping; do not implement business logic or branching based on\nthe identity type or string structure. The set of identity\nshapes may grow over time and is not considered breaking.\n\nThe `example` above illustrates the OAuth (identity-provider)\nshape. Set for all supported authentication methods; the CRN\nshape varies by auth type:\n\n  * User: `crn://confluent.cloud/organization=12345/user=u-abc123`\n  * Service account: `crn://confluent.cloud/organization=12345/service-account=sa-abc123`\n  * OAuth (identity provider): `crn://confluent.cloud/organization=12345/identity-provider=op-12345/identity=alice@example.com`\n\nFor the OAuth shape, the value after `identity=` is the JWT\nclaim resolved by the identity provider's configured\n`identity_claim` (or the identity pool's `identity_claim` when\na single pool is in scope) — commonly `claims.sub`, but\nprovider-configurable. The email shown above is just one\nexample; the actual value depends on the identity provider\nconfiguration and may be a subject UUID, a username, or any\nother opaque claim value.\n\nWhen the request was authenticated via OAuth and authorized\nagainst multiple identity pools, this CRN also appears as\n`spec.principal`. May be omitted for statements created before\nthis field was introduced.\n"
          maxLength: 1024
          readOnly: true
      readOnly: true
