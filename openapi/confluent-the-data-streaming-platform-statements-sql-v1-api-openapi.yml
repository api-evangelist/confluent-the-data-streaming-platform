      summary: Delete a Statement
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Make a request to delete a statement.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
        description: The unique identifier for the organization.
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - name: statement_name
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the statement.
      tags:
