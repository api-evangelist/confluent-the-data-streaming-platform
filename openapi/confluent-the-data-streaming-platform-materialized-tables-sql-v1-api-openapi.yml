          items:
            $ref: '#/components/schemas/sql.v1.ColumnDetails'
        watermark:
          $ref: '#/components/schemas/sql.v1.Watermark'
        constraints:
          type: array
          description: Specify table constraints.
          items:
            $ref: '#/components/schemas/sql.v1.Constraint'
        distribution:
          description: Only applicable on creation; ignored on update.
          x-immutable: true
          allOf:
          - $ref: '#/components/schemas/sql.v1.Distribution'
        query:
          type: string
          description: Contains the query section (usually starting with a SELECT) of the latest Materialized Table.
          example: SELECT user_id, product_id, price, quantity FROM orders WHERE price > 1000;
          maxLength: 131072
