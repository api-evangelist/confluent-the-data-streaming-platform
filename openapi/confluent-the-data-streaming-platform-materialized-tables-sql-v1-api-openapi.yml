openapi: 3.2.0
info:
  title: Confluent Cloud Materialized Tables (sql/v1) API
  version: ''
  x-api-id: 46234552-5833-42eb-ba0f-883ad3f70d2b
  x-audience: external-public
  x-logo:
    url: https://assets.confluent.io/m/1661ef5e4ff82d3d/
  description: '# Introduction


    Note


    This documents the collection of Confluent Cloud APIs.'
servers:
- url: https://api.confluent.cloud
  description: Confluent Cloud API
tags:
- name: Materialized Tables (sql/v1)
  description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


    `MaterializedTable` represents a core resource used to define and manage streaming SQL queries that persist results.

    The API allows you to list, create, read, update, and delete your materialized tables.

    ## The Materialized Table Model'
paths:
  /sql/v1/organizations/{organization_id}/environments/{environment_id}/materialized-tables:
    servers:
    - url: https://flink.region.provider.confluent.cloud
      description: Flink Compute Pool Endpoint
    get:
      x-lifecycle-stage: General Availability
      x-self-access: true
      x-request-access-name: SQL API v1
      operationId: listSqlv1MaterializedTables
      summary: List all materialized tables
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Retrieve a sorted and paginated list of all materialized tables.'
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
          format: uuid
        required: true
        description: The unique identifier for the organization.
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 100
        description: A pagination size for collection requests.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: An opaque pagination token for collection requests.
      tags:
      - Materialized Tables (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      - external-access-token: []
      responses:
        '200':
          description: A list of Materialized Tables.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sql.v1.MaterializedTableList'
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
  /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables:
    servers:
    - url: https://flink.region.provider.confluent.cloud
      description: Flink Compute Pool Endpoint
    post:
      x-lifecycle-stage: General Availability
      operationId: createSqlv1MaterializedTable
      summary: Create a materialized table
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Create a new Materialized Table.'
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: kafka_cluster_id
        required: true
        schema:
          type: string
        description: The unique identifier for the database.
      tags:
      - Materialized Tables (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      - external-access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/sql.v1.MaterializedTable'
              - type: object
                required:
                - name
                - spec
                properties:
                  spec:
                    type: object
                    required:
                    - query
                    - kafka_cluster_id
      responses:
        '201':
          description: Materialized Table is being created
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            Location:
              schema:
                type: string
                format: uri
                example: https://flink.region.provider.confluent.cloud/sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}
              description: Materialized Table uri
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/sql.v1.MaterializedTable'
                - type: object
                  required:
                  - spec
                  - status
                  properties:
                    spec:
                      type: object
                      required:
                      - query
                      - compute_pool_id
                      - principal
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
  ? /sql/v1/organizations/{organization_id}/environments/{environment_id}/databases/{kafka_cluster_id}/materialized-tables/{table_name}
  : servers:
    - url: https://flink.region.provider.confluent.cloud
      description: Flink Compute Pool Endpoint
    get:
      x-lifecycle-stage: General Availability
      operationId: getSqlv1MaterializedTable
      summary: Read a materialized table
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Retrieve a specific Materialized Table by name.'
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: kafka_cluster_id
        required: true
        schema:
          type: string
        description: The unique identifier for the database.
      - name: table_name
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the Materialized Table
      tags:
      - Materialized Tables (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      - external-access-token: []
      responses:
        '200':
          description: The requested Materialized Table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sql.v1.MaterializedTable'
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
    put:
      x-lifecycle-stage: General Availability
      operationId: updateSqlv1MaterializedTable
      summary: Update/Evolve a materialized table
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Make a request to update a Materialized Table''s mutable fields.

        Mutable fields include: `query`, `stopped`, `compute_pool_id`, `principal`, `columns`, `watermark`, `constraints` and `table_options`.'
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: kafka_cluster_id
        required: true
        schema:
          type: string
        description: The unique identifier for the database.
      - name: table_name
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the Materialized Table
      tags:
      - Materialized Tables (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      - external-access-token: []
      requestBody:
        description: The Materialized Table resource with updated spec fields.
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/sql.v1.MaterializedTable'
              - type: object
                required:
                - spec
                - name
                - metadata
                properties:
                  spec:
                    type: object
                    required:
                    - kafka_cluster_id
                  metadata:
                    type: object
                    required:
                    - resource_version
      responses:
        '200':
          description: Materialized Table update accepted.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sql.v1.MaterializedTable'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
    delete:
      x-lifecycle-stage: General Availability
      operationId: deleteSqlv1MaterializedTable
      summary: Delete a materialized table
      description: '![General Availability](#section/Versioning/API-Lifecycle-Policy)


        Delete a specific Materialized Table by name.'
      parameters:
      - in: path
        name: organization_id
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier for the organization
      - in: path
        name: environment_id
        required: true
        schema:
          type: string
        description: The unique identifier for the environment.
      - in: path
        name: kafka_cluster_id
        required: true
        schema:
          type: string
        description: The unique identifier for the database.
      - name: table_name
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the Materialized Table
      tags:
      - Materialized Tables (sql/v1)
      security:
      - resource-api-key: []
      - global-api-key: []
      - external-access-token: []
      responses:
        '202':
          description: A Materialized Table is being deleted.
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
components:
  schemas:
    sql.v1.Distribution:
      type: object
      description: Distribution (bucket by) strategy.
      required:
      - kind
      properties:
        kind:
          type: string
          x-extensible-enum:
          - HASH
          description: The kind of distribution.
          example: HASH
        keys:
          type: array
          items:
            type: string
          example:
          - user_id
        bucket_count:
          type: integer
          format: int32
          minimum: 1
          default: 6
          description: The number of buckets.
          example: 12
    sql.v1.ColumnDetails:
      type: object
      description: Details of a column in the Materialized Table.
      discriminator:
        propertyName: kind
        mapping:
          Physical: '#/components/schemas/sql.v1.PhysicalColumn'
          Metadata: '#/components/schemas/sql.v1.MetadataColumn'
          Computed: '#/components/schemas/sql.v1.ComputedColumn'
      oneOf:
      - $ref: '#/components/schemas/sql.v1.PhysicalColumn'
      - $ref: '#/components/schemas/sql.v1.MetadataColumn'
      - $ref: '#/components/schemas/sql.v1.ComputedColumn'
    sql.v1.ScalingStatus:
      description: Scaling status for this statement.
      type: object
      properties:
        scaling_state:
          description: 'OK: The statement runs at the right scale.


            PENDING_SCALE_DOWN: The statement requires less resources, and will be scaled down in the near future.


            PENDING_SCALE_UP: The statement requires more resources, and will be scaled up in the near future.


            POOL_EXHAUSTED: The statement requires more resources, but not enough resources are available.

            '
          example: OK
          readOnly: true
          type: string
          x-extensible-enum:
          - OK
          - PENDING_SCALE_DOWN
          - PENDING_SCALE_UP
          - POOL_EXHAUSTED
        last_updated:
          description: The last time the scaling status was updated.
          example: 1996-03-19 01:02:03-04:05
          format: date-time
          readOnly: true
          type: string
      readOnly: true
    sql.v1.StatementWarning:
      type: object
      description: Represents a non-fatal issue encountered during statement processing.
      required:
      - severity
      - created_at
      - reason
      - message
      properties:
        severity:
          $ref: '#/components/schemas/sql.v1.WarningSeverity'
        created_at:
          type: string
          format: date-time
          description: The timestamp when the warning was created. It is represented in RFC3339 format and is in UTC.
          example: '2025-11-10T16:20:00Z'
          readOnly: true
        reason:
          type: string
          description: A machine-readable short, upper case summary delimited by underscore.
          example: MISSING_WINDOW_START_END
        message:
          type: string
          description: A human-readable string containing the description of the warning.
          example: The statement is missing window start and end bounds which may lead to unbounded state growth.
    ObjectMeta:
      description: ObjectMeta is metadata that all persisted resources must have, which includes all objects users must create.
      required:
      - self
      properties:
        self:
          description: Self is a Uniform Resource Locator (URL) at which an object can be addressed. This URL encodes the service location, API version, and other particulars necessary to locate the resource at a point in time
          type: string
          format: uri
          readOnly: true
          example: https://api.confluent.cloud/v2/kafka-clusters/lkc-f3a90de
        resource_name:
          description: Resource Name is a Uniform Resource Identifier (URI) that is globally unique across space and time. It is represented as a Confluent Resource Name
          type: string
          format: uri
          readOnly: true
          example: crn://confluent.cloud/kafka=lkc-f3a90de
        created_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was created. It is represented in RFC3339 format and is in UTC.
        updated_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was last updated. It is represented in RFC3339 format and is in UTC.
        deleted_at:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05-07:00'
          readOnly: true
          description: The date and time at which this object was (or will be) deleted. It is represented in RFC3339 format and is in UTC.
      readOnly: true
    sql.v1.Constraint:
      type: object
      description: A constraint on the materialized table.
      properties:
        name:
          type: string
          example: pk_orders
        type:
          type: string
          x-extensible-enum:
          - PRIMARY_KEY
          description: The type of constraint.
          example: PRIMARY_KEY
        columns:
          type: array
          items:
            type: string
          example:
          - user_id
          - product_id
        enforced:
          type: boolean
          description: Whether the constraint is enforced.
          default: false
    sql.v1.Watermark:
      type: object
      description: Watermark strategy for the Materialized Table resource.
      properties:
        column:
          type: string
          example: event_timestamp
        expression:
          type: string
          example: event_timestamp - INTERVAL '5' SECOND
    sql.v1.MaterializedTableStatus:
      type: object
      description: The status of the Materialized Table.
      properties:
        phase:
          type: string
          x-extensible-enum:
          - PENDING
          - RUNNING
          - COMPLETED
          - DELETING
          - FAILING
          - FAILED
          - CREATING
          - ALTERING
          - DEGRADED
          - STOPPING
          - STOPPED
          description: The lifecycle phase of the materialized table.
          example: RUNNING
        detail:
          type: string
          description: Optional. Human-readable description of phase.
          example: Materialized table is running.
        warnings:
          type: array
          description: List of warnings encountered during materialized table execution.
          items:
            $ref: '#/components/schemas/sql.v1.MaterializedTableWarning'
        creation_statement:
          type: string
          description: Entire Materialized Table statement as submitted by user e.g CREATE OR ALTER MATERIALIZED TABLE ...
          example: CREATE OR ALTER MATERIALIZED TABLE high-value-orders AS SELECT user_id, product_id, price, quantity FROM orders WHERE price > 1000;
        scaling_status:
          $ref: '#/components/schemas/sql.v1.ScalingStatus'
        version:
          type: integer
          format: int32
          minimum: 1
          description: Represents the evolution history of the Materialized Table. The current value indicates the latest version.
          example: 3
        latest_version:
          type: integer
          format: int32
          minimum: 1
          description: Represents the latest submitted version of the Materialized Table. When a query evolution is accepted, `latest_version` is incremented immediately and will be greater than `version` until the new query is fully activated.
          example: 4
    Failure:
      type: object
      description: Provides information about problems encountered while performing an operation.
      required:
      - errors
      properties:
        errors:
          description: List of errors which caused this operation to fail
          type: array
          items:
            $ref: '#/components/schemas/Error'
          uniqueItems: true
    RowFieldType:
      type: object
      properties:
        name:
          type: string
          description: The name of the field.
        field_type:
          allOf:
          - $ref: '#/components/schemas/DataType'
          description: The data type of the field.
        description:
          type: string
          description: The description of the field.
      required:
      - name
      - field_type
    DataType:
      type: object
      properties:
        type:
          type: string
          description: The data type of the column.
        nullable:
          type: boolean
          description: Indicates whether values in this column can be null.
        length:
          type: integer
          format: int32
          description: The length of the data type.
        precision:
          type: integer
          format: int32
          description: The precision of the data type.
        scale:
          type: integer
          format: int32
          description: The scale of the data type.
        key_type:
          allOf:
          - $ref: '#/components/schemas/DataType'
          description: The type of the key in the data type (if applicable).
        value_type:
          allOf:
          - $ref: '#/components/schemas/DataType'
          description: The type of the value in the data type (if applicable).
        element_type:
          allOf:
          - $ref: '#/components/schemas/DataType'
          description: The type of the element in the data type (if applicable).
        fields:
          type: array
          items:
            $ref: '#/components/schemas/RowFieldType'
          description: The fields of the element in the data type (if applicable).
        resolution:
          type: string
          description: The resolution of the data type (if applicable).
        fractional_precision:
          type: integer
          format: int32
          description: The fractional precision of the data type (if applicable).
        class_name:
          type: string
          description: The class name of the structured data type (if applicable).
      required:
      - type
      - nullable
    sql.v1.MaterializedTableList:
      type: object
      description: A list of Materialized Table resources.
      required:
      - api_version
      - kind
      - metadata
      - data
      properties:
        api_version:
          type: string
          enum:
          - sql/v1
          readOnly: true
        kind:
          type: string
          enum:
          - MaterializedTableList
          readOnly: true
        metadata:
          $ref: '#/components/schemas/ListMeta'
        data:
          type: array
          description: A data property that contains an array of resource items. Each entry in the array is a separate resource.
          items:
            $ref: '#/components/schemas/sql.v1.MaterializedTable'
          uniqueItems: true
    sql.v1.MetadataColumn:
      description: Metadata columns reference system properties.
      allOf:
      - $ref: '#/components/schemas/sql.v1.ColumnCommon'
      - type: object
        required:
        - kind
        - metadata_key
        properties:
          name:
            example: table_offset
          type:
            example:
              type: BIGINT
          kind:
            type: string
            description: The kind of column.
            enum:
            - Metadata
            example: Metadata
          metadata_key:
            type: string
            description: The system metadata key to reference.
            example: offset
          virtual:
            type: boolean
            description: Indicates if the metadata column is virtual.
            default: false
            example: true
    sql.v1.MaterializedTable:
      type: object
      description: Represents a Materialized Table resource.
      required:
      - api_version
      - kind
      - metadata
      - name
      - organization_id
      - environment_id
      - spec
      properties:
        api_version:
          type: string
          enum:
          - sql/v1
          description: APIVersion defines the schema version of this representation of a resource.
          example: sql/v1
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          enum:
          - MaterializedTable
          readOnly: true
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - type: object
            properties:
              self:
                example: https://flink.us-west1.aws.confluent.cloud/sql/v1/environments/env-123/databases/lkc-123/materialized-tables/high-value-orders
              uid:
                example: 12345678-1234-1234-1234-123456789012
              resource_version:
                example: a23av
              resource_name:
                example: ''
              labels:
                type: object
                additionalProperties:
                  type: string
        name:
          type: string
          description: The user-provided name of the resource, unique within the Kafka cluster. May contain ASCII alphanumerics, '.', '_' and '-'; must not be '.' or '..'; max length 249.
          pattern: ^[a-zA-Z0-9._-]+$
          maxLength: 249
          example: high-value-orders
          x-immutable: true
        organization_id:
          type: string
          format: uuid
          description: The unique identifier for the organization.
          x-immutable: true
          readOnly: true
        environment_id:
          type: string
          description: The unique identifier for the environment.
          x-immutable: true
          readOnly: true
        spec:
          $ref: '#/components/schemas/sql.v1.MaterializedTableSpec'
        status:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/sql.v1.MaterializedTableStatus'
    ListMeta:
      type: object
      description: ListMeta describes metadata that resource collections may have
      properties:
        first:
          description: A link to the first page of results. If a response does not contain a first link, then direct navigation to the first page is not supported.
          type:
          - string
          - 'null'
          format: uri
          example: https://api.confluent.cloud/v2/resourcekinds
        last:
          description: A link to the last page of results. If a response does not contain a last link, then direct navigation to the last page is not supported.
          type:
          - string
          - 'null'
          format: uri
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=bcAOehAY8F16YD84Z1wT
        prev:
          description: A link to the previous page of results. If a response does not contain a prev link, then either there is no previous data or backwards traversal through the result set is not supported.
          type:
          - string
          - 'null'
          format: uri
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=YIXRY97wWYmwzrax4dld
        next:
          description: A link to the next page of results. If a response does not contain a next link, then there is no more data available.
          type:
          - string
          - 'null'
          format: uri
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=UvmDWOB1iwfAIBPj6EYb
        total_size:
          description: Number of records in the full result set. This response may be paginated and have a smaller number of records.
          type: integer
          format: int32
          minimum: 0
          example: 123
    sql.v1.WarningSeverity:
      type: string
      x-extensible-enum:
      - LOW
      - MODERATE
      - CRITICAL
      description: 'Indicates the severity of the warning.


        LOW: Indicates a low severity warning and for informing the user.


        MODERATE: Indicates a moderate severity warning and may require user action. Could cause degraded statements if certain conditions apply.


        CRITICAL: Indicates a critical severity warning and requires user action. It will cause degraded statements eventually.

        '
      example: MODERATE
