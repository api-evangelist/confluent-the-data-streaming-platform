      description: Physical columns define the structure of the table and the data types of its fields.
      allOf:
      - $ref: '#/components/schemas/sql.v1.ColumnCommon'
      - type: object
        required:
        - kind
        properties:
          name:
            example: user_id
          type:
            example:
              type: BIGINT
          kind:
            type: string
            description: The kind of column.
            enum:
            - Physical
            example: Physical
    sql.v1.MaterializedTableSpec:
      type: object
      description: The specifications of the Materialized Table.
      properties:
        kafka_cluster_id:
          type: string
          description: 'The ID of the Kafka cluster hosting the Materialized Table''s topic.

            This value must match the `kafka_cluster_id` path parameter.

            It is immutable after creation and is ignored or rejected on update if changed.'
          example: lkc-12345
          x-immutable: true
        compute_pool_id:
          type: string
          description: 'The id associated with the compute pool in context.

            If not specified, the materialized table will use the default compute pool. The default pool is automatically determined by the system.'
          example: lfcp-123
        principal:
          type: string
          description: The id of a principal this Materialized Table query runs as.
          example: sa-abc123
          maxLength: 255
        stopped:
          type: boolean
          description: Indicates whether the Materialized Table query should be stopped.
          example: false
        table_options:
          type: object
          description: Defines configuration properties for the table, equivalent to the SQL 'WITH' clause
          additionalProperties:
            type: string
          maxProperties: 8192
        session_options:
          type: object
          description: Session configurations equivalent to the SQL 'SET' statement. Only applicable on creation; ignored on update.
          additionalProperties:
            type: string
          maxProperties: 8192
          x-immutable: true
        columns:
          type: array
