    notifications.v1.UserNotification:
      type: object
      description: "`UserNotification` objects represent in-app notifications scoped to a specific\nConfluent Cloud user. Each notification carries a severity, references the\nConfluent Cloud resource it relates to, and tracks whether the user has read it.\n\nThis API lets you list and retrieve your notifications, mark notifications as\nread or unread, and fetch an unread-count summary.\n\n`read` is the only mutable field on this resource; `PATCH` requests with values\nfor other fields will have those values silently ignored.\n\nTwo `PATCH` shapes are supported:\n- `PATCH /user-notifications/{id}` — update a single notification by id.\n- `PATCH /user-notifications` — update the read state of every notification\n  matching the supplied filter query parameters. The body is a narrow\n  payload (`{ \"read\": true | false }`) and the same filters accepted by\n  the list endpoint scope which notifications are updated (with the\n  exception of `include`, which is a list-only partial-response selector).\n\nThe heavier `integrations` and `recommended_actions` fields are populated on\nsingle-resource reads (`GET /user-notifications/{id}`) and omitted from list\nresponses by default to keep collection payloads slim. Use the `include`\nquery parameter on the list endpoint to opt in to populating these fields\n(`?include=integrations,recommended_actions`).\n\n\nRelated guide: [Cloud Notifications](https://docs.confluent.io/cloud/current/monitoring/configure-notifications.html#notifications-for-ccloud).\n\n## The User Notifications Model\n<SchemaDefinition schemaRef=\"#/components/schemas/notifications.v1.UserNotification\" />"
      properties:
        api_version:
          type: string
          enum:
          - notifications/v1
          description: APIVersion defines the schema version of this representation of a resource.
          readOnly: true
        kind:
          type: string
          description: Kind defines the object this REST resource represents.
          readOnly: true
          enum:
          - UserNotification
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace; it is normally unique across time but not space. That is, you can assume that the ID will not be reclaimed and reused after an object is deleted ("time"); however, it may collide with IDs for other object `kinds` or objects of the same `kind` within a different scope/namespace ("space").
          type: string
          maxLength: 255
          readOnly: true
          example: dlz-f3a90de
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/notifications/v1/user-notifications/un-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/user-notification=un-12345
        read:
          type: boolean
          description: Whether the notification has been read by the user.
          example: false
        read_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The time the notification was marked as read, or `null` if it is unread.
          example: '2026-01-31T11:00:00Z'
          readOnly: true
        severity:
          type: string
          x-extensible-enum:
          - CRITICAL
          - WARN
          - INFO
          description: 'The severity level of the notification.

            - CRITICAL: a high impact notification which needs immediate attention.

            - WARN: a warning notification which can be addressed now or later.

            - INFO: an informational notification.

            '
          example: CRITICAL
          readOnly: true
        received_at:
          type: string
          format: date-time
          description: The time the underlying event was generated.
          example: '2026-01-31T10:35:00Z'
          readOnly: true
        resource:
          description: 'The Confluent Cloud resource this notification relates to, embedded

            as a point-in-time snapshot at delivery time. Values remain accurate

            even if the underlying resource is later renamed or deleted.

            '
          allOf:
          - $ref: '#/components/schemas/notifications.v1.ResourceSnapshot'
          readOnly: true
        actions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/notifications.v1.NotificationAction'
          description: 'Ordered list of user-facing actions associated with this notification.

            The first entry is the primary action (`role: PRIMARY`) and is always

            present; subsequent entries are secondary. Cardinality is open-ended —

            additional actions may be added over time without a breaking schema

            change.

            '
          readOnly: true
        notification_type:
          description: 'The notification type that triggered this notification, embedded as

            a point-in-time snapshot at delivery time so values remain accurate

            even if the underlying `NotificationType` is later modified.

            '
          allOf:
          - $ref: '#/components/schemas/notifications.v1.NotificationType'
          readOnly: true
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/notifications.v1.Integration'
          description: 'The integrations this notification was delivered to. Each entry is a

            point-in-time snapshot of the integration at delivery time, so values

            remain accurate even if the underlying `Integration` is later

            modified or deleted. Populated on single-resource reads

            (`GET /user-notifications/{id}`); omitted from list responses.

            '
          readOnly: true
        recommended_actions:
          description: 'Versioned payload describing the recommended actions a user can take

            in response to this notification. The shape is stable per `version`

            and consumers should branch on `version` when deserializing.

            Populated on single-resource reads (`GET /user-notifications/{id}`);

            omitted from list responses.

            '
          allOf:
          - $ref: '#/components/schemas/notifications.v1.RecommendedActions'
          readOnly: true
