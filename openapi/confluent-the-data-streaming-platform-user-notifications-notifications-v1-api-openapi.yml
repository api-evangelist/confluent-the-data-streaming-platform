      x-request-access-name: User Notifications API v1
      operationId: updateNotificationsV1UserNotification
      summary: Update a User Notification
      description: '![Early Access](#section/Versioning/API-Lifecycle-Policy) ![Request Access To User Notifications API v1](mailto:ccloud-api-access+notifications-v1-early-access@confluent.io?subject=Request%20to%20join%20notifications/v1%20API%20Early%20Access&body=I%E2%80%99d%20like%20to%20join%20the%20Confluent%20Cloud%20API%20Early%20Access%20for%20notifications/v1%20to%20provide%20early%20feedback%21%20My%20Cloud%20Organization%20ID%20is%20%3Cretrieve%20from%20https%3A//confluent.cloud/settings/billing/payment%3E.)


        Make a request to update a user notification.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the user notification.
      tags:
      - User Notifications (notifications/v1)
      security:
      - cloud-api-key: []
      - confluent-sts-access-token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/notifications.v1.UserNotification'
      responses:
        '200':
          description: User Notification.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/notifications.v1.UserNotification'
                - type: object
                  required:
                  - api_version
                  - kind
