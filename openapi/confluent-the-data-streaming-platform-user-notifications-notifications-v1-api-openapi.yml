tags:
- name: User Notifications (notifications/v1)
  description: '![Early Access](#section/Versioning/API-Lifecycle-Policy) ![Request Access To User Notifications API v1](mailto:ccloud-api-access+notifications-v1-early-access@confluent.io?subject=Request%20to%20join%20notifications/v1%20API%20Early%20Access&body=I%E2%80%99d%20like%20to%20join%20the%20Confluent%20Cloud%20API%20Early%20Access%20for%20notifications/v1%20to%20provide%20early%20feedback%21%20My%20Cloud%20Organization%20ID%20is%20%3Cretrieve%20from%20https%3A//confluent.cloud/settings/billing/paymen…'
paths:
  /notifications/v1/user-notifications:
    x-lifecycle-stage: Early Access
    x-self-access: false
    x-request-access-name: User Notifications API v1
    get:
      x-lifecycle-stage: Early Access
      x-self-access: false
      x-request-access-name: User Notifications API v1
      operationId: listNotificationsV1UserNotifications
      summary: List of User Notifications
      description: '![Early Access](#section/Versioning/API-Lifecycle-Policy) ![Request Access To User Notifications API v1](mailto:ccloud-api-access+notifications-v1-early-access@confluent.io?subject=Request%20to%20join%20notifications/v1%20API%20Early%20Access&body=I%E2%80%99d%20like%20to%20join%20the%20Confluent%20Cloud%20API%20Early%20Access%20for%20notifications/v1%20to%20provide%20early%20feedback%21%20My%20Cloud%20Organization%20ID%20is%20%3Cretrieve%20from%20https%3A//confluent.cloud/settings/billing/payment%3E.)


        Retrieve a sorted, filtered, paginated list of all user notifications.'
      parameters:
      - name: read
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/BooleanFilter'
        description: Filter the results where read is true or false.
      - name: severity
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MultipleSearchFilter'
        example:
        - CRITICAL
        - WARN
        description: 'Filter notifications by severity. Pass the parameter multiple

          times to match any of the given values

          (`?severity=CRITICAL&severity=WARN`). A notification matches if

          its `severity` equals any of the listed values.

          '
        style: form
        explode: true
      - name: include
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SearchFilter'
        example: integrations,recommended_actions
        description: 'Comma-separated list of optional fields to populate in the response

          items. Allowed values: `integrations`, `recommended_actions`. By

          default these fields are omitted from list responses to keep

          collection payloads slim; set this parameter to opt in. This is a

          partial-response selector, not a value filter.

          '
      - name: resource.type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MultipleSearchFilter'
        example:
        - CLUSTER
        - CONNECTOR
        description: 'Filter notifications by the Confluent Cloud resource type they

          relate to. Pass the parameter multiple times to match any of the

          given values (`?resource.type=CLUSTER&resource.type=CONNECTOR`).

          A notification matches if its `resource.type` equals any of the

          listed values.

          '
        style: form
        explode: true
      - name: resource.crn
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MultipleSearchFilter'
        example:
        - crn://confluent.cloud/organization=org-abc/environment=env-xyz/cloud-cluster=lkc-ds23ad
        - crn://confluent.cloud/organization=org-abc/environment=env-mx05q
        description: 'Filter notifications by the CRN of the Confluent Cloud resource they

          relate to. Pass the parameter multiple times to match any of the

          given CRNs; a notification matches if its `resource.crn` equals any

          of the listed values.

          '
        style: form
        explode: true
      - name: search
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SearchFilter'
        example: cluster failure
        description: 'Free-text partial-match search across the embedded notification

          type''s `display_name` and `description`.

          '
      - name: time_range
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SearchFilter'
        example: PAST_24H
        description: 'Filter notifications by a preset time window relative to now. Allowed

          values: `PAST_24H` (last 24 hours), `PAST_7D` (last 7 days), `PAST_30D`

          (last 30 days).

          '
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 100
          maximum: 250
          x-max-page-items: 500
        description: A pagination size for collection requests.
      - name: page_token
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
        description: An opaque pagination token for collection requests.
      - name: sort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - severity
            - -severity
            - received_at
            - -received_at
          default:
          - -received_at
        description: The list of fields and directions that are used to sort the collection.
        style: form
        explode: false
      tags:
      - User Notifications (notifications/v1)
      security:
      - cloud-api-key: []
      - confluent-sts-access-token: []
      responses:
        '200':
          description: User Notification.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/notifications.v1.UserNotificationList'
          headers:
            X-Request-Id:
              schema:
                type: string
              description: The unique identifier for the API request.
            X-RateLimit-Limit:
              schema:
                type: integer
              description: The maximum number of requests you're permitted to make per time period.
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: The number of requests remaining in the current rate limit window.
            X-RateLimit-Reset:
              schema:
                type: integer
              description: "The relative time in seconds until the current rate-limit window resets.  \n  \n**Important:** This differs from Github and Twitter's same-named header which uses UTC epoch seconds. We use relative time to avoid client/server time synchronization issues."
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '403':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/DefaultSystemError'
