id_prefix_caveat: Confluent states in its compatibility policy that adding or removing a fixed prefix
  (such as lkc- on Kafka cluster IDs) is a BACKWARD-COMPATIBLE change, and that clients must treat IDs
  as opaque strings of up to 255 characters. Do not parse these prefixes as a contract.
containment:
- Organization -> Environment -> {Kafka cluster, Schema Registry cluster, ksqlDB cluster, Flink compute
  pool}
- Kafka cluster -> {Topic, Consumer group, ACL, Cluster link, Mirror topic, Connector}
- Schema Registry cluster -> {Subject -> Schema version, Tag, Entity}
- Environment -> Flink statement (scoped by organization_id + environment_id in the path)
