object_model:
  shape: metadata / spec / status
  description: 'Confluent Cloud resources are declarative and intent-oriented. Every resource carries
    api_version, kind, a metadata block (id, self, resource_name, created_at, updated_at), a spec block
    describing desired state, and a status block describing observed state. List responses are {api_version,
    kind: <Kind>List, metadata: {next,...}, data: [...]}.'
  blocks:
  - api_version
  - kind
  - metadata
  - spec
  - status
  metadata_fields:
  - id
  - self
  - resource_name
  - created_at
  - updated_at
  - deleted_at
  resource_name_scheme: crn://confluent.cloud/<type>=<id>
