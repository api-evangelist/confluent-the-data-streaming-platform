format: confluent-error-envelope
format_note: NOT RFC 9457. Confluent Cloud returns application/json with a top-level "errors" array whose
  members follow a JSON:API-influenced shape (id, status, code, title, detail, source.pointer/source.parameter).
  The docs additionally describe a newer single-object envelope (status + error{code,message,details,timestamp,path,suggestion}
  + requestId + doc_url) being rolled out across Confluent Cloud APIs. The Connect v1 API group uses a
  third, different error structure, which Confluent states explicitly.
envelope:
  media_type: application/json
  container: errors[]
  fields:
  - name: id
    type: string
    description: A unique identifier for this particular occurrence of the problem.
  - name: status
    type: string
    description: The HTTP status code applicable to this problem, expressed as a string value.
  - name: code
    type: string
    description: An application-specific error code, expressed as a string value. Uppercase with underscores,
      e.g. RESOURCE_NOT_FOUND.
  - name: title
    type: string
    description: A short, human-readable summary of the problem, stable across occurrences.
  - name: detail
    type: string
    description: A human-readable explanation specific to this occurrence.
  - name: source.pointer
    type: string
    description: JSON Pointer (RFC 6901) to the offending entity in the request document.
  - name: source.parameter
    type: string
    description: The query parameter that caused the error.
  - name: error_code
    type: integer
  - name: message
    type: string
    nullable: true
  trace_header: X-Request-Id
  trace_note: Every documented 4xx/5xx component response carries an X-Request-Id header for support and
    tracing.
