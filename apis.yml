- aid: confluent-the-data-streaming-platform:connect-rest-api
  name: Kafka Connect REST API
  description: >-
    The Kafka Connect REST API manages connectors, tasks, and worker configuration. Operators use it to
    deploy, configure, pause, resume, and delete source and sink connectors, inspect task status, and
    restart failed tasks. In Confluent Cloud, managed connectors are provisioned through the Cloud REST
    API while runtime status is exposed via the Connect REST surface.
  humanURL: https://docs.confluent.io/platform/current/connect/references/restapi.html
  baseURL: https://api.confluent.cloud
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
