apis:
- aid: confluent-the-data-streaming-platform:kafka-rest-api
  name: Confluent Kafka REST API
  description: >-
    The Kafka REST API (Confluent REST Proxy in self-managed deployments, Kafka REST in Cloud) provides
    HTTP access to Apache Kafka topics, consumers, partitions, brokers, and ACLs. Clients without a native
    Kafka library can produce and consume records, manage topics, and inspect metadata over HTTP. Cloud
    variants additionally enforce RBAC and Confluent Cloud authentication.
  humanURL: https://docs.confluent.io/platform/current/kafka-rest/api.html
  baseURL: https://pkc-00000.region.provider.confluent.cloud
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Apache Kafka
  - Producer
  - Consumer
  - REST
  properties:
  - type: Documentation
    url: https://docs.confluent.io/platform/current/kafka-rest/api.html
  - type: Cloud Documentation
    url: https://docs.confluent.io/cloud/current/kafka-rest/kafka-rest-cc.html
  x-features:
  - Topic Management
  - Produce and Consume over HTTP
  - Partition Inspection
  - Consumer Group Management
  - Broker Metadata
  - ACL Management
  x-use-cases:
  - Produce events from clients without a Kafka library
  - Bridge legacy systems to Kafka over HTTP
  - Inspect topic and partition metadata from web tools
  - Manage ACLs from automation scripts
- aid: confluent-the-data-streaming-platform:schema-registry-api
