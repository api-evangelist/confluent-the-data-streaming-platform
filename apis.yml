apis:
- aid: confluent-the-data-streaming-platform:cloud-rest-api
  name: Confluent Cloud REST API
  description: >-
    The Confluent Cloud REST API is the management plane for Confluent Cloud. It is used to manage organizations,
    environments, Kafka and Flink clusters, service accounts, API keys, role bindings, networking, schema
    registry clusters, and connector instances. The API uses Cloud API keys for authentication and follows
    Confluent's resource-oriented v2 conventions.
  humanURL: https://docs.confluent.io/cloud/current/api.html
  baseURL: https://api.confluent.cloud
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Confluent Cloud
  - Management
  - REST
  properties:
  - type: Documentation
    url: https://docs.confluent.io/cloud/current/api.html
  - type: APIReference
    url: https://docs.confluent.io/cloud/current/api.html
  x-features:
  - Cluster Lifecycle Management
  - Environments and Organizations
  - API Key Management
  - RBAC and Service Accounts
  - Networking and Private Link
  - Schema Registry Cluster Management
  - Connector Provisioning
  - Flink Compute Pools
  x-use-cases:
  - Provision Kafka clusters in Confluent Cloud
  - Automate environment and access management
  - Rotate API keys and manage service accounts
  - Wire up private networking for clusters
  - Manage Flink compute pools and statements
- aid: confluent-the-data-streaming-platform:kafka-rest-api
  name: Confluent Kafka REST API
  description: >-
    The Kafka REST API (Confluent REST Proxy in self-managed deployments, Kafka REST in Cloud) provides
    HTTP access to Apache Kafka topics, consumers, partitions, brokers, and ACLs. Clients without a native
    Kafka library can produce and consume records, manage topics, and inspect metadata over HTTP. Cloud
    variants additionally enforce RBAC and Confluent Cloud authentication.
  humanURL: https://docs.confluent.io/platform/current/kafka-rest/api.html
  baseURL: https://pkc-XXXXX.region.aws.confluent.cloud
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Apache Kafka
  - Producer
  - Consumer
  - REST
  properties:
  - type: Documentation
    url: https://docs.confluent.io/platform/current/kafka-rest/api.html
  - type: Cloud Documentation
    url: https://docs.confluent.io/cloud/current/kafka-rest/index.html
  x-features:
  - Topic Management
  - Produce and Consume over HTTP
  - Partition Inspection
  - Consumer Group Management
  - Broker Metadata
  - ACL Management
  x-use-cases:
  - Produce events from clients without a Kafka library
  - Bridge legacy systems to Kafka over HTTP
  - Inspect topic and partition metadata from web tools
  - Manage ACLs from automation scripts
- aid: confluent-the-data-streaming-platform:schema-registry-api
  name: Confluent Schema Registry REST API
  description: >-
    The Schema Registry REST API stores and serves Avro, JSON Schema, and Protobuf schemas with versioning
    and compatibility enforcement. It is available both as a managed Confluent Cloud service and as a
    self-managed component of Confluent Platform. The full developer profile lives in the api-evangelist/confluent-schema-registry
    repository.
  humanURL: https://docs.confluent.io/platform/current/schema-registry/develop/api.html
  baseURL: https://psrc-XXXXX.region.aws.confluent.cloud
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Avro
