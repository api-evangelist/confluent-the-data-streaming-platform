    and compatibility enforcement. It is available both as a managed Confluent Cloud service and as a
    self-managed component of Confluent Platform. The full developer profile lives in the api-evangelist/confluent-schema-registry
    repository.
  humanURL: https://docs.confluent.io/platform/current/schema-registry/develop/api.html
