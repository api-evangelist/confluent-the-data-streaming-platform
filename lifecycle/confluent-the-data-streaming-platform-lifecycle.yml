lifecycle_phases:
- phase: Early Access
  meaning: >-
    May change at any time. Not recommended for production. Not officially supported.
    Access granted explicitly by Confluent.
- phase: Preview
  meaning: >-
    Unlikely to change between Preview and GA. Not recommended for production.
    Officially supported for non-production. Accessible to all users.
- phase: Limited Availability
  meaning: >-
    Available to select customers in a subset of regions/providers/networks. Recommended
    for production.
- phase: Generally Available
  meaning: >-
    Will not change at short notice. Recommended and officially supported for
    production. An API is GA unless explicitly marked otherwise.
- phase: Deprecated
  meaning: >-
    Still supported, no longer under active development. Will be removed at an announced
    date; migration strongly recommended.
- phase: Sunset
  meaning: Removed, no longer supported or available.
deprecation:
  policy_url: https://docs.confluent.io/cloud/current/api.html#deprecation-policy
  notice_period_days: 180
  notice_note: >-
    Confluent announces deprecations at least 180 days before a breaking change and
    maintains the deprecated API in its original form for that period. Exceptions apply
    for critical security vulnerabilities or functional defects.
  breaking_change_cadence: >-
    Backward-incompatible changes and deprecations are made approximately once per year
    under the Confluent Cloud Upgrade Policy, with 180 days notice emailed to all
    registered Confluent Cloud users.
  sunset_header: false
  deprecation_header: false
  header_note: >-
