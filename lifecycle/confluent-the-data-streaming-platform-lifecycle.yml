  backward_compatible_changes:
  - Adding new API resources
  - Adding new optional request parameters
  - Adding new properties to existing resources
  - Reordering properties in responses
  - Changing the length or format of object IDs, including adding or removing fixed prefixes
  - Adding new API event types or properties on them
  - Omitting null-valued properties from responses
  forward_compatibility: not guaranteed; MUST IGNORE / MUST FORWARD rules apply to clients
  client_responsibilities:
  - Rate limits and pagination sizes are NOT part of the API contract and may change dynamically
  - Do not assume a primitive property is constrained to a fixed value set
  - Do not assume an undeclared property will be present
  - Handle 301/307 redirects and honour Location
