plan_count: 5
description: >-
  Confluent Cloud is priced on consumption, not on API calls. The unit is the eCKU
  (elastic Confluent Kafka Unit) charged per hour, plus per-GB data in/out and per-GB-month
  storage; the cluster TYPE is the plan. This artifact replaces a 2026-05-04 scaffold
  that invented request-quota tiers (1,000 requests/month free, 100 requests/minute
  professional) which Confluent has never published — those figures were bulk-sweep
  defaults, not provider values, and are removed here.
pricing_model: consumption
billing_units: [eCKU-hour, GB data in/out, GB-month storage]
currency: USD
free_trial:
