api_pricing:
  metered: false
  note: >-
    The Confluent Cloud REST API, Kafka REST, Schema Registry, Connect, Flink SQL and
    the MCP servers are not separately metered. They are governed by rate limits (see
    rate-limits/) and by the consumption of the underlying resources they operate on.
